[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reproducible-econ"
version = "0.1.0"
description = "Lightweight stage caching and run manifests for reproducible economic research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
authors = [{ name = "Cory Baird", email = "cory.d.baird@gmail.com" }]
dependencies = [
  "pandas>=2.2.3,<4",
  "pyarrow>=19.0.0",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/reproducible_econ"]

[project.urls]
Homepage = "https://github.com/corybaird/reproducible-econ"
Changelog = "https://github.com/corybaird/reproducible-econ/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/corybaird/reproducible-econ/blob/main/ROADMAP.md"
